<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Entre ou crie sua conta SubMinder."
    />
    <title>Bem vindo ao SubMinder</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/auth.js" defer></script>
  </head>
  <body>
    <main class="auth-layout">
      <section class="intro-panel" aria-label="Sobre o SubMinder">
        <a class="brand" href="/" aria-label="Início do SubMinder">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span>SubMinder</span>
        </a>
        <div class="intro-copy">
          <h1>Suas inscrições, todas num só lugar.</h1>
          <p>
            Se mantenha informado sobre suas assinaturas e nunca mais perca um pagamento.
          </p>
        </div>
      </section>

      <section class="form-panel" aria-labelledby="form-heading">
        <div class="form-wrap">
          <p class="eyebrow">Bem vindo ao SubMinder</p>
          <h2 id="form-heading">Entre na sua conta</h2>
          <p class="form-description" id="form-description">
            Continue de onde você parou.
          </p>

          <div class="form-tabs" role="tablist" aria-label="Opções da conta">
            <button
              class="form-tab is-active"
              id="login-tab"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="login-panel"
            >
              Entrar
            </button>
            <button
              class="form-tab"
              id="register-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="register-panel"
            >
              Criar conta
            </button>
          </div>

          <form id="login-panel" class="auth-form" role="tabpanel" aria-labelledby="login-tab">
            <label for="login-email">E-mail</label>
            <input
              id="login-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="voce@exemplo.com"
              required
            />
            <label for="login-password">Senha</label>
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Digite sua senha"
              required
            />
            <button class="primary-button" type="submit">Entrar</button>
          </form>

          <form
            id="register-panel"
            class="auth-form"
            role="tabpanel"
            aria-labelledby="register-tab"
            hidden
          >
            <label for="register-username">Nome</label>
            <input
              id="register-username"
              name="username"
              type="text"
              autocomplete="name"
              placeholder="Seu nome"
              required
            />
            <label for="register-email">E-mail</label>
            <input
              id="register-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="voce@exemplo.com"
              required
            />
            <label for="register-password">Senha</label>
            <input
              id="register-password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Crie uma senha"
              minlength="8"
              required
            />
            <button class="primary-button" type="submit">Criar conta</button>
          </form>

          <p
            class="form-message"
            id="form-message"
            role="alert"
            aria-live="polite"
          ></p>
        </div>
      </section>
    </main>
  </body>
</html>
